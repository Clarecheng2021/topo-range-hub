services:
  toporangehub:
    build: .
    ports:
      - "8080:8080"
    environment:
      ZHIPUAI_API_KEY: ${ZHIPUAI_API_KEY:?Set ZHIPUAI_API_KEY in the shell or .env file}
      ZHIPU_VISION_MODEL: ${ZHIPU_VISION_MODEL:-glm-5.3-flash}
    volumes:
      - toporangehub-data:/data/jobs
    restart: unless-stopped

volumes:
  toporangehub-data:
    # Keep the old physical volume so the branding change preserves job data.
    name: ${TOPORANGEHUB_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-automated_industrial_control_system_security_exercise_range}_factorytwin-data}

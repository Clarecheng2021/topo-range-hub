name: factory-demo

mgmt:
  network: factory-demo-mgmt
  ipv4-subnet: 172.31.100.0/24

topology:
  nodes:
    boundary-fw:
      kind: linux
      image: alpine:3.20
      cmd: sleep infinity
      labels:
        factory.type: firewall
        factory.zone: enterprise
    dmz-switch:
      kind: linux
      image: alpine:3.20
      cmd: sleep infinity
      labels:
        factory.type: switch
        factory.zone: dmz
    control-switch:
      kind: linux
      image: alpine:3.20
      cmd: sleep infinity
      labels:
        factory.type: switch
        factory.zone: control
    hmi-01:
      kind: linux
      image: alpine:3.20
      cmd: sleep infinity
      labels:
        factory.type: hmi
        factory.zone: control
    plc-01:
      kind: linux
      image: alpine:3.20
      cmd: sleep infinity
      labels:
        factory.type: plc
        factory.zone: field
  links:
    - endpoints: ["boundary-fw:eth1", "dmz-switch:eth1"]
    - endpoints: ["dmz-switch:eth2", "control-switch:eth1"]
    - endpoints: ["control-switch:eth2", "hmi-01:eth1"]
    - endpoints: ["control-switch:eth3", "plc-01:eth1"]

name: toporangehub-ics-water-treatment-v1

services:
  hmi:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:18082:80"
    volumes:
      - ./hmi:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - hmi-edge
      - range-net
    depends_on:
      - plc-simulator
    restart: unless-stopped

  plc-simulator:
    build:
      context: ./plc-simulator
    expose:
      - "8081"
    volumes:
      - plc-data:/data
    networks:
      - range-net
    restart: unless-stopped

volumes:
  plc-data:

networks:
  range-net:
    internal: true
  hmi-edge:
    driver: bridge
